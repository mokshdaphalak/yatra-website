

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Yatra</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <!-- Navigation bar -->
    <header class="navbar">
        <div class="container nav-content">
            <a href="../index.html" class="logo">Yatra.</a>
            <nav class="nav-links">
                <a href="../index.html">Home</a>
                <a href="destinations.html">Destinations</a>
                <a href="plan-trip.html">Plan Trip</a>
                <a href="about.html">About</a>
                <a href="login.html">Login</a>
                <a href="signup.html" class="btn">Sign Up</a>
            </nav>
        </div>
    </header>

    <!-- Signup banner -->
    <section class="page-banner">
        <div class="container">
            <h1>Join the Yatra Community</h1>
            <p>Create an account and start exploring.</p>
        </div>
    </section>

    <!-- Signup form -->
    <main class="section">
        <div class="container" style="max-width: 600px;">
            <div class="form-panel">
                <div class="section-heading">
                    <h2>Create Your Account</h2>
                    <p>Your next adventure starts here.</p>
                </div>

                <form action="#" method="get">
                    <div class="field">
                        <label for="fullname">Full Name</label>
                        <input type="text" id="fullname" name="fullname"
                               placeholder="Enter your full name" required>
                    </div>

                    <br>

                    <div class="field">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email"
                               placeholder="Enter your email" required>
                    </div>

                    <br>

                    <div class="field">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone"
                               placeholder="Enter your phone number"
                               pattern="[0-9]{10}" maxlength="10" required>
                    </div>

                    <br>

                    <div class="field">
                        <label for="password">Create Password</label>
                        <input type="password" id="password" name="password"
                               placeholder="Create a password" minlength="8" required>
                    </div>

                    <br>

                    <div class="field">
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password"
                               name="confirm-password"
                               placeholder="Re-enter your password" minlength="8" required>
                    </div>

                    <br>

                    <div class="field">
                        <label>
                            <input type="checkbox" required>
                            I agree to the terms and conditions.
                        </label>
                    </div>

                    <br>

                    <button type="submit" class="btn">Create Account</button>

                    <p style="margin-top: 20px;">
                        Already have an account?
                        <a href="login.html">Login here</a>
                    </p>
                </form>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>© 2026 Yatra. Discover more, travel better.</p>
        </div>
    </footer>

</body>
</html>
